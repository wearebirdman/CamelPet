<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>骆驼桌宠 CamelPet</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
      }

      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
        cursor: grab;
      }

      #app:active {
        cursor: grabbing;
      }

      /* left/top/width/height 由 animation.applyLayout() 依据皮肤 manifest 计算并覆盖 */
      #pet {
        position: absolute;
        left: 32px;
        top: 60px;
        transform-origin: bottom center;
        image-rendering: pixelated;
        -webkit-user-drag: none;
      }

      .bubble {
        position: absolute;
        background: rgba(255, 255, 255, 0.94);
        border: 2px solid #111;
        border-radius: 12px;
        padding: 10px 14px;
        font: bold 14px/1.35 ui-monospace, 'Microsoft YaHei', sans-serif;
        color: #111;
        max-width: 220px;
        /*
         * 刻意不加 box-shadow：桌宠窗口是全透明的，模糊阴影没有背景可投影，
         * 渲染出来就是一圈灰色光晕（叠加时几个阴影互相加深更明显）。
         * 立体感靠 2px 深色描边提供，也更贴合像素画风格。
         */
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <img id="pet" alt="pet" draggable="false" />
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
